services:

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - votingresult

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - votingresult

volumes:
  db-data:

networks:
  votingresult:
    external: true
